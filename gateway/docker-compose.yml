services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: qingyu
      POSTGRES_USER: qingyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qingyu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingyu -d qingyu"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # secrets come from gateway/.env (see .env.example); compose refuses to
      # start without them rather than silently running with example values
      APP_ENV: ${APP_ENV:-production}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in gateway/.env}
      EVIDENCE_READ_API_TOKEN: ${EVIDENCE_READ_API_TOKEN:?set EVIDENCE_READ_API_TOKEN in gateway/.env}
      EVIDENCE_CURSOR_SIGNING_KEY: ${EVIDENCE_CURSOR_SIGNING_KEY:?set EVIDENCE_CURSOR_SIGNING_KEY in gateway/.env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in gateway/.env}
      ARCHIVE_ROOT: ${ARCHIVE_ROOT:-/data}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - archive_data:/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  qingyu_postgres:
  archive_data:
